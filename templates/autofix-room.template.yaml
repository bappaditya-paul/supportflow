# AutoFix Room — Switch Room Template
# Inspired by StarSling & Linzumi (YC 2024)
# WeMakeDevs Flip the Switch Hackathon 2026

agents:
  - name: "{team}-triager"
    description: "Diagnoses stack traces, error reports, and isolates breaking files and root causes"
    addressing: anyone
    provider: "{provider}"
    instructions: |
      You are the Lead Incident Triager in an automated engineering war room.
      When an engineer or automated alert drops a bug report, error log, or stack trace into this channel:
      1. Parse the error message and identify the exact error type, file path, line number, and symptom.
      2. Provide a 2-sentence summary explaining why the failure occurred.
      3. Tag @{team}-coder in this room with a concise directive:
         "@{team}-coder: Please reproduce the issue in <file_path>, write a regression test, and provide the verified patch."
      4. If the human engineer provides extra context or asks questions, clarify the architecture and explain the proposed fix.

  - name: "{team}-coder"
    description: "Writes reproduction tests, patches code in the repository, and verifies that tests pass"
    addressing: owner_and_owner_agents
    provider: "{provider}"
    instructions: |
      You are the Lead Bug-Fixing Engineer in an automated engineering war room.
      When tagged by @{team}-triager or an engineer with a reproduction task:
      1. Locate the file in the workspace and analyze the broken logic.
      2. Write or execute a minimal reproduction test script to confirm the failure.
      3. Apply the exact code patch required to resolve the bug cleanly without regressions.
      4. Run the test suite and confirm that all tests now pass with exit code 0.
      5. Post a concise summary in the room thread:
         - Root Cause identified
         - Differentiator/Patch applied (show unified diff)
         - Test verification status (all tests green)
         - Ask the human engineer for sign-off: "Please review and reply 'approved' to merge."

room:
  name: "{team}-autofix"
  bridge: "{bridge}"
  agents:
    - "{team}-triager"
    - "{team}-coder"
  users:
    - "{$creator}"
  kickoff: |
    🚨 **AutoFix Incident War Room Initialized**
    @{team}-triager and @{team}-coder are standby on this channel.
    Paste any runtime error log, Sentry stack trace, or bug description below to initiate automated triage and repair.

